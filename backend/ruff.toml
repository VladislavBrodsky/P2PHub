# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
line-length = 88
target-version = "py310"

[lint]
# #comment: Expanded selection to catch logic bugs (B), complexity (C90), and modernizing code (UP).
# I: isort for clean imports, N: naming conventions, SIM: simplify code.
select = [
    "E4", "E7", "E9", "F", 
    "B",    # flake8-bugbear
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "C90",  # mccabe complexity
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PERF"  # performance rules
]
ignore = [
    "E402", # module level import not at top (needed for app structure)
    "E701", # multiple statements on one line
    "F401", # unused imports (ignored in scripts)
    "B008", # function call in defaults (FastAPI Depends() is an exception)
    "B904", # raise from
    "RUF001", "RUF002", "RUF003", # ambiguous docstring characters (Russian locale strings)
    "RUF012", # ClassVar type hinting
    "RUF059", # unpacked variable not used
    "RUF100", # unused noqa directive
    "C901", # complexity
    "UP035", # dict vs Dict typing
    "N802", "N803", "N806", "N815", # Naming conventions
    "SIM102", # nested ifs
    "SIM117", # nested withs
    "PERF203", "PERF401", # performance warnings
    "B007", # loop variable unused
    "E741", # ambiguous variable name
]

# Allow Autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore imports not at top of file and bare excepts in bot.py and migrations
"bot.py" = ["E402", "E722"]
"migrations/env.py" = ["E402"]
"scripts/*.py" = ["E402", "E722", "E701", "F401"]

[format]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
