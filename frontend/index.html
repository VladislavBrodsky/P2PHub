    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Onest:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">

  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('p2p_theme') || 'dark'; // Default to dark for elite feel
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<!-- #comment: Removed utility classes from body to let base.css dynamic variables handle the theme -->

<body>
  <div id="root"></div>
  <script>
    window.__APP_STARTUP__ = {
      html_loaded: Date.now(),
      script_started: false,
      react_rendered: false,
      errors: []
    };
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      window.__APP_STARTUP__.errors.push({ msg, url, lineNo, columnNo, error: error?.stack });
      console.error('[CRITICAL] window.onerror:', msg, url, lineNo);
      const root = document.getElementById('root');
      if (root && root.innerHTML === '') {
        root.innerHTML = '<div style="color:red; padding:20px;">Runtime Error: ' + msg + '</div>';
      }
      return false;
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    setTimeout(() => {
      if (!window.__APP_STARTUP__.script_started) {
        console.error('[FATAL] Main script failed to start within 15 seconds');
        document.getElementById('root').innerHTML += '<div style="color:orange; padding:20px;">Main bundle failed to execute. Check console.</div>';
      }
    }, 15000);
  </script>
</body>

</html>
